[[$Crumbs]]
<div class="card mb-3 text-center">
	<div class="card-header bg-dark text-white">[[*menutitle:default=`[[*pagetitle]]`]]</div>
	<div class="card-body bg-info">
		[[*longtitle:notempty=`<h5 class="card-title fw-bold">[[*longtitle]]</h5>`]]
		[[*introtext:notempty=`<p class="card-text fst-italic">[[*introtext]]</p>`]]
	</div>
</div>
