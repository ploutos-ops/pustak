<tr>
	<!-- text-body because .balanceCounter carries `color: white`, which is only legible on a
	     coloured cell; here the counter sits in a bare <td>. -->
	<td><span class="balanceCounter text-body"></span></td>
	<td>[[+id]]</td>
	<td class="estate-link" data-content-id="[[+id]]" data-content-url="[[~[[+id]]]]" tabindex="0">[[+menutitle:default=`[[+pagetitle]]`]]</td>
	<td>[[+longtitle]]</td>
	<td>[[+introtext]]</td>
</tr>
